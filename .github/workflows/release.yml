name: Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.24.14
          name: "AdGuard-Home-gogogo Manager v2.24.14"
          body: |
            ### AdGuard-Home-gogogo Manager `v2.24.14`

            专为 **[AdGuard-Home-gogogo](https://github.com/WEIHEWU/AdGuard-Home-For-Android-wu)** 定制的轻量级配套管理器客户端（包名：`com.wu.adgogogo`）。

            #### 🆕 v2.24.14 更新亮点
            - **新增「🌐 海外模式 (Overseas) / 🇨🇳 国内模式 (CN)」双模一键热切换**：
              - 首页顶部快捷卡片与 DNS 设置页均内置双模分段切换开关（默认激活海外模式）；
              - 一键无损切换上游加密 DNS、订阅规则源与 VPN 接管策略，100% 保留个人自定义规则与动态端口，无需重启手机即时生效。
          files: |
            releases/AdGuardHomeManager.apk
