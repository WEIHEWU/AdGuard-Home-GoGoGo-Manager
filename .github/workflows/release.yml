name: Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.24.24-rc.1
          name: "AdGuard-Home-GoGoGo Manager v2.24.24-rc.1 (Pre-release)"
          prerelease: true
          make_latest: false
          body: |
            ### AdGuard-Home-GoGoGo Manager `v2.24.24-rc.1` (Candidate / Pre-release)

            **AdGuard-Home-GoGoGo Manager - 专为 [AdGuard-Home-GoGoGo](https://github.com/WEIHEWU/AdGuard-Home-GoGoGo) 打造的轻量现代化 Android 控制面板**（桌面名称：`AdGuard Home GoGoGo`，快捷磁贴：`AGH GoGoGo`，包名：`com.wu.adgogogo`）。

            > ⚠️ Candidate pre-release: Core race/unit/android_slim (Linux ARM64) tests, Manager static analysis & 35 unit/widget/HTTP mock tests, and APK signature/ABI verification passed; on-device Android verification (SendGrid check -> confirmed narrow allowlist -> A/AAAA verify -> retry -> undo) is pending.

            #### 🆕 v2.24.24-rc.1 收尾补修亮点
            - **基于提交 `X-User-Rules-Revision` 与核心实例 ID 的可核验撤销归属**：
              - 写入自定义规则时读取 POST 返回头 `X-User-Rules-Revision`，回读 `/filtering/status` 时必须同时满足版本号等于本次提交版本号、完整规则逐项一致与新增槽位匹配才签发撤销凭证；
              - 配套 `Core v2026-11-16-rc.3` 每次启动生成唯一核心实例 ID，核心重启或配置被其他客户端更新后旧撤销凭证一律保守拒绝并保留既有规则；不支持提交版本的旧核心保守禁用自动撤销。
          files: |
            releases/AdGuardHomeManager.apk
