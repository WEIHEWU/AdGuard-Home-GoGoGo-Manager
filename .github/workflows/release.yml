name: Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.24.12
          name: "AdGuard Home Manager v2.24.12"
          body: |
            ### AdGuard Home Manager `v2.24.12`

            专为 **[AdGuard Home For Android](https://github.com/WEIHEWU/AdGuard-Home-For-Android-wu)** 定制的轻量级配套管理器客户端。

            #### 🆕 v2.24.12 更新亮点
            - **全面支持局域网明文 HTTP 与私有 IP 访问**：
              - AndroidManifest 及网络安全策略配置开启全端口 `usesCleartextTraffic`，支持直接访问各类局域网服务；
              - 误杀排错与域名提取增加私有 IP（`10.x`, `172.16-31.x`, `192.168.x`, `127.x`）智能识别，避免纯 IP 及非标端口（如 `:9978`）被错误升级为 HTTPS。
            - **保持极致精简与秒开体验（仅 8.2 MB）**：
              - 纯轻量化架构，零卡顿切换与纯内存 RingBuffer 实时日志。
          files: |
            releases/AdGuardHomeManager.apk
