name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-manager-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Release Metadata
        run: |
          case "${GITHUB_REF_NAME:-}" in
            v*) VERSION_TAG="$GITHUB_REF_NAME" ;;
            *)  VERSION_TAG="v2.24.28" ;;
          esac
          case "$VERSION_TAG" in
            *-rc*|*beta*|*candidate*) IS_PRERELEASE="true"; MAKE_LATEST="false"; TITLE_SUFFIX=" (Pre-release)" ;;
            *)                       IS_PRERELEASE="false"; MAKE_LATEST="true"; TITLE_SUFFIX="" ;;
          esac
          echo "VERSION_TAG=$VERSION_TAG" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> "$GITHUB_ENV"
          echo "MAKE_LATEST=$MAKE_LATEST" >> "$GITHUB_ENV"
          echo "TITLE_SUFFIX=$TITLE_SUFFIX" >> "$GITHUB_ENV"

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: "AdGuard-Home-GoGoGo Manager ${{ env.VERSION_TAG }}${{ env.TITLE_SUFFIX }}"
          draft: false
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          make_latest: ${{ env.MAKE_LATEST }}
          body: |
            ### AdGuard-Home-GoGoGo Manager `${{ env.VERSION_TAG }}`

            **AdGuard-Home-GoGoGo Manager - 专为 [AdGuard-Home-GoGoGo](https://github.com/WEIHEWU/AdGuard-Home-GoGoGo) 打造的轻量现代化 Android 控制面板**（桌面名称：`AdGuard Home GoGoGo`，快捷磁贴：`AGH GoGoGo`，包名：`com.wu.adgogogo`）。

            > ⚠️ **验证与实机状态说明**：Manager 静态分析（`flutter analyze --no-fatal-infos`）、51 项单元与 Widget 测试及 APK 签名包体核验已通过；本端环境未连接实机（`adb devices -l` 为空），候选版以来的真机视觉与端到端交互验收尚未在实机执行，升级后请以实际设备展示为准。

            #### 本次调整说明（日志列表紧凑布局）
            - **删除独立展开箭头列与空占位**：普通行与聚合行统一采用紧凑状态列，彻底消除由于箭头列存在引起的视觉不对齐与空白占位冗余。
            - **重复次数移至右侧状态区**：当且仅当重复次数 > 1 时在状态文字下方展示 `×N`（超过万次时自动精简为 `×10k`），不撑宽卡片，且为读屏提供完整无障碍语义支持（“已放行，重复 8 次” / “Processed, repeated 8 times”）。
            - **重新分配第二行左侧空间**：移除原有的“重复 N 次”副标题文本，为协议标签、时间与规则来源/规则摘要（`· 规则摘要`）释放充足横向空间，超长时安全截断且在 300dp 极窄屏幕与 1.8x 大字号下无任何 RenderFlex 溢出。
            - **交互行为与过滤策略保持不变**：点击整行继续弹出完整详情对话框，Core 二进制、过滤规则、订阅及网络策略完全保持不变。

            #### 升级提示
            - 本次为管理器 UI 紧凑布局优化；覆盖安装 Manager APK（`2.24.28+197`）即可生效。
          files: |
            releases/AdGuardHomeManager.apk
