name: Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.24.22-rc.1
          name: "AdGuard-Home-GoGoGo Manager v2.24.22-rc.1 (Pre-release)"
          prerelease: true
          make_latest: false
          body: |
            ### AdGuard-Home-GoGoGo Manager `v2.24.22-rc.1` (Candidate / Pre-release)

            **AdGuard-Home-GoGoGo Manager - 专为 [AdGuard-Home-GoGoGo](https://github.com/WEIHEWU/AdGuard-Home-GoGoGo) 打造的轻量现代化 Android 控制面板**（桌面名称：`AdGuard Home GoGoGo`，快捷磁贴：`AGH GoGoGo`，包名：`com.wu.adgogogo`）。

            > ⚠️ Candidate pre-release: core unit/race tests, Flutter static analysis, widget/HTTP mock tests (`31/31`), and APK signature/ABI verification passed; on-device Android verification (real SNI click retries & calendar jump) is pending.

            #### 🆕 v2.24.22-rc.1 升级亮点（误杀排错联动升级 + 一键诊断包）
            - **误杀排错 Core + Manager 全链路联动**：
              - 离线域名解析 `DomainInputParser`（剥离包装/端口、末尾点、IDN Punycode、`co.uk` 等多级公共后缀边界保护、拒绝多 URL/非 http scheme 误拼接）；
              - 实时规则批量检测 `RuleBatchChecker`（`Uri.queryParameters` 安全编码、并发 `<=3`、5 秒超时、错误绝不伪装为“正常放行”、原域名 + 多级父域名辅助检测、输入切换/切换服务器自动作废过期响应）；
              - 最近拦截优先级识别 `FilteredSNI` / `NotFilteredSNI`，默认同秒同域名同原因聚合折叠，接入 Core `/control/querylog/blocked_summary` 内存摘要防高频重试挤掉首条关键阻断；
              - 显式两级加白闭环：精确区分“仅放行当前域及子域 (`@@||host^`)”与“放行触发规则域名”并二次确认，保留既有顺序及注释的串行写入、回读校验、清缓存、复检辨别 `$important`，以及一键精确撤销；
            - **详细调试日志开关与一键诊断包导出**：
              - 支持定时自动关闭（默认 30 分钟）的模块详细调试日志开关，全链路脱敏预览及 ZIP 诊断包生成与系统分享。
          files: |
            releases/AdGuardHomeManager.apk
