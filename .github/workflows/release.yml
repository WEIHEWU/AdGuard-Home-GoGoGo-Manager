name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-manager-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Release Metadata
        run: |
          case "${GITHUB_REF_NAME:-}" in
            v*) VERSION_TAG="$GITHUB_REF_NAME" ;;
            *)  VERSION_TAG="v2.24.29" ;;
          esac
          case "$VERSION_TAG" in
            *-rc*|*beta*|*candidate*) IS_PRERELEASE="true"; MAKE_LATEST="false"; TITLE_SUFFIX=" (Pre-release)" ;;
            *)                       IS_PRERELEASE="false"; MAKE_LATEST="true"; TITLE_SUFFIX="" ;;
          esac
          echo "VERSION_TAG=$VERSION_TAG" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> "$GITHUB_ENV"
          echo "MAKE_LATEST=$MAKE_LATEST" >> "$GITHUB_ENV"
          echo "TITLE_SUFFIX=$TITLE_SUFFIX" >> "$GITHUB_ENV"

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: "AdGuard-Home-GoGoGo Manager ${{ env.VERSION_TAG }}${{ env.TITLE_SUFFIX }}"
          draft: false
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          make_latest: ${{ env.MAKE_LATEST }}
          body: |
            ### AdGuard-Home-GoGoGo Manager `${{ env.VERSION_TAG }}`

            **AdGuard-Home-GoGoGo Manager - 专为 [AdGuard-Home-GoGoGo](https://github.com/WEIHEWU/AdGuard-Home-GoGoGo) 打造的轻量现代化 Android 控制面板**（桌面名称：`AdGuard Home GoGoGo`，快捷磁贴：`AGH GoGoGo`，包名：`com.wu.adgogogo`）。

            > ✅ **验证状态**：`flutter analyze --no-pub --no-fatal-infos`（0 error / 0 warning）、全量 56 项单元与 Widget 测试及 `arm64-v8a` 混淆 Release APK（`2.24.29+199`，`8,873,878 B`，SHA-256: `d30e2725483f3d2420259efaaf2b867c55a6f86e3e86f1bae784718d02ad5640`）核验通过。

            #### 本次正式版更新内容（可靠性、诊断导出与聚合日志增强）
            - **诊断包默认保存至系统公共 `Download` 目录**：新增 `MediaStore.Downloads` 原生通道（Android 10+ 免存储权限直写公共 `Download/agh_diag_*.zip`，Android 9 及以下兼容公共目录并保留私有目录兜底），界面明确提示保存路径（`已保存至 Download/...`），同时保留系统分享入口。
            - **诊断包采用设备本地时间命名**：`agh_diag_YYYYMMDD_HHMMSS_xxxx.zip`、`bundle_id` 与 `manifest.json` / `00_README_AND_MANIFEST.txt` 统一以设备本地时间生成并在正文同时记录 `generated_at_local`（含时区偏移）与 `generated_at_utc`。
            - **诊断包版本号与只读隔离对齐**：统一通过 `AppConfigProvider.appVersion` 注入管理器版本，全量采集严格只读（耗时预算 20s，不抢占操作锁、不修改规则、不重启核心）。
            - **聚合日志详情弹窗支持一键放行 / 拦截**：保持日志列表行紧凑对齐与右侧无额外按钮布局不变，在点击聚合日志后的详情弹窗 / 长按菜单内提供带 `$important` 的直接放行与拦截操作。
            - **稳定性与并发队列加固**：修复挂起 `su` 进程超时后强制 `kill()` 回收并清空串行队列、强化恢复出厂规则 `getFiltering()` 失败防清空门控、同步等待动态端口就绪、清理各界面控制器泄露及有界化请求体读取与响应码透传。

            #### 升级提示
            - 覆盖安装 Manager APK（`2.24.29+199`）或直接刷入模块 `v20261125.1` 即可自动完成更新。
          files: |
            releases/AdGuardHomeManager.apk
