name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-manager-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Release Metadata
        run: |
          case "${GITHUB_REF_NAME:-}" in
            v*) VERSION_TAG="$GITHUB_REF_NAME" ;;
            *)  VERSION_TAG="v2.24.27-rc.1" ;;
          esac
          case "$VERSION_TAG" in
            *-rc*|*beta*|*candidate*) IS_PRERELEASE="true"; MAKE_LATEST="false"; TITLE_SUFFIX=" (Pre-release)" ;;
            *)                       IS_PRERELEASE="false"; MAKE_LATEST="true"; TITLE_SUFFIX="" ;;
          esac
          echo "VERSION_TAG=$VERSION_TAG" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> "$GITHUB_ENV"
          echo "MAKE_LATEST=$MAKE_LATEST" >> "$GITHUB_ENV"
          echo "TITLE_SUFFIX=$TITLE_SUFFIX" >> "$GITHUB_ENV"

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: "AdGuard-Home-GoGoGo Manager ${{ env.VERSION_TAG }}${{ env.TITLE_SUFFIX }}"
          draft: false
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          make_latest: ${{ env.MAKE_LATEST }}
          body: |
            ### AdGuard-Home-GoGoGo Manager `${{ env.VERSION_TAG }}`

            **AdGuard-Home-GoGoGo Manager - 专为 [AdGuard-Home-GoGoGo](https://github.com/WEIHEWU/AdGuard-Home-GoGoGo) 打造的轻量现代化 Android 控制面板**（桌面名称：`AdGuard Home GoGoGo`，快捷磁贴：`AGH GoGoGo`，包名：`com.wu.adgogogo`）。

            > ⚠️ **验证与实机状态说明**：Manager 静态分析（`flutter analyze --no-fatal-infos`）、48 项单元与 Widget 测试（含“聚合重复”状态展示、多态 reason / predicted_blocked / 窄屏大字体防溢出 / 深色与主题色测试）及 APK 签名包体核验已通过；本端环境未连接实机（`adb devices -l` 为空），实机端到端交互验收待实机检验。

            #### 主要修复（基于 `v2.24.26`）
            - **修复日志“聚合重复”条目右侧状态缺失**：抽出共用状态组件 `LogStatusIndicator`，普通日志与聚合日志统一复用 `getFilteredStatus()`。
            - **严格按 `group.reason` 渲染状态并保留展开箭头**：聚合条目右侧并排显示 `[状态图标+文字] [展开箭头]`，`Rewrite*` 统一归类，未触发拦截的 `predicted_blocked` 暂停放行保持已处理展示并在详情弹窗保留预测说明，点击仍可正常展开详细记录弹窗。
            - **保持核心与策略不变**：沿用 `v2026-11-16-rc.3` 核心、既定规则订阅、SNI 检查与手动规则来源逻辑；此候选版本为预发布，保留 `v2.24.26` 为当前 Latest 稳定版。
          files: |
            releases/AdGuardHomeManager.apk
