name: Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.24.26-rc.1
          name: "AdGuard-Home-GoGoGo Manager v2.24.26-rc.1 (Pre-release)"
          prerelease: true
          make_latest: false
          body: |
            ### AdGuard-Home-GoGoGo Manager `v2.24.26-rc.1` (Candidate / Pre-release)

            **AdGuard-Home-GoGoGo Manager - 专为 [AdGuard-Home-GoGoGo](https://github.com/WEIHEWU/AdGuard-Home-GoGoGo) 打造的轻量现代化 Android 控制面板**（桌面名称：`AdGuard Home GoGoGo`，快捷磁贴：`AGH GoGoGo`，包名：`com.wu.adgogogo`）。

            > ⚠️ Candidate pre-release: Core race/unit/android_slim (Linux ARM64) tests unchanged at `v2026-11-16-rc.3`, Manager static analysis & all 46 unit/widget/HTTP mock tests, and APK signature/ABI verification passed; on-device Android verification is pending.

            #### 🆕 v2.24.26-rc.1 手动规则来源精准绑定补修
            - **提交绑定型来源记录（`applyCommitBoundDiff`）**：
              - 写入前后严格仅对“提交前列表 → 实际提交列表”计算差异，并通过 `X-User-Rules-Revision` 与回读全量逐项校验确认后才确认来源；若期间被外部并发修改打断，不回滚也不误记外部规则并提示“规则操作已提交，但来源确认被其他更新打断”；旧核心无版本信息时自动降级为`待确认`。
            - **区分“历史来源”与“当前关联”**：
              - 同一可信版本或本端连续确认修改维持`已确认`；未观测外部版本偏移、外部删除再重加或核心重启均保留历史信息与备注但自动降级为`待确认`，重复相同行降为`重复歧义`，禁止靠同文本自动恢复归属。
            - **备份导入安全加固**：
              - 严格校验 `action` / `source` / `sync_status` 枚举，未知枚举直接拒绝；导入保留历史时间、历史来源与备注但当前关联默认`待确认`（不存在则`已不存在`），不覆盖本地已有`已确认`记录且绝不改动 Core 规则。
          files: |
            releases/AdGuardHomeManager.apk
