name: Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.24.17
          name: "AdGuard-Home-GoGoGo Manager v2.24.17"
          body: |
            ### AdGuard-Home-GoGoGo Manager `v2.24.17`

            **AdGuard-Home-GoGoGo Manager - 专为 [AdGuard-Home-GoGoGo](https://github.com/WEIHEWU/AdGuard-Home-GoGoGo) 打造的轻量现代化 Android 控制面板**（桌面名称：`AdGuard Home GoGoGo`，快捷磁贴：`AGH GoGoGo`，包名：`com.wu.adgogogo`）。

            #### 🆕 v2.24.17 升级亮点（最强满血形态适配）
            - **恢复并升级 `iptables -t mangle` SNI 规则链真实状态自检**：
              - 同步检测 `nat` 表 `ADGUARD`（DNS 转发）与 `mangle` 表 `AGH_SNI`（`NFQUEUE --queue-bypass` 首包 SNI 嗅探）双链状态；双链均生效时主页警告黄条自动消失，设置页实时展示「运行中 · DNS + SNI 双链生效」；
              - 点击「一键修复」或「网络刷新」时，统一调用根命名空间 `service.sh --repair` 同步修复并重挂 `nat` + `mangle` 双链，自动重绑动态 HTTP 控制端口；
            - **全链路丝滑热切换与软重启兼容**：
              - 切换「海外模式 / 国内模式」前自动清理手动停止锁标记，无损保留个人自定义规则与动态端口。
          files: |
            releases/AdGuardHomeManager.apk
