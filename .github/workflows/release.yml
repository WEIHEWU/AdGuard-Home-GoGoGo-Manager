name: Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.24.18
          name: "AdGuard-Home-GoGoGo Manager v2.24.18"
          body: |
            ### AdGuard-Home-GoGoGo Manager `v2.24.18`

            **AdGuard-Home-GoGoGo Manager - 专为 [AdGuard-Home-GoGoGo](https://github.com/WEIHEWU/AdGuard-Home-GoGoGo) 打造的轻量现代化 Android 控制面板**（桌面名称：`AdGuard Home GoGoGo`，快捷磁贴：`AGH GoGoGo`，包名：`com.wu.adgogogo`）。

            #### 🆕 v2.24.18 升级亮点（丝滑规则更新体验与终极稳定适配）
            - **大幅优化 30 万+ 大规则订阅刷新体验**：
              - 将 `/control/filtering/refresh`、添加与编辑规则源的 HTTP 超时放宽至 **60 秒**；
              - 将黑名单与白名单刷新由并发撞锁改为串行有序请求，消除 `filters update procedure is already running` 冲突报错；
              - 增强规则更新结果容错判定：每次更新后强制同步刷新界面与首页规则计数，当规则库已成功拉取更新或个别源偶发网络抖动时，精准刷新规则数，彻底告别误报红条「无法更新订阅规则」。
            - **全链路兼容 `v20261112.4` 满血 DNS + SNI 双链核心**：
              - 同步检测 `nat` 表 `ADGUARD` 与 `mangle` 表 `AGH_SNI` 双链健康度，支持海外/国内双模无损热切换与软重启自愈。
          files: |
            releases/AdGuardHomeManager.apk
