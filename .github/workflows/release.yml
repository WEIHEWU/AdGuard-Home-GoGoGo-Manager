name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-manager-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Release Metadata
        run: |
          case "${GITHUB_REF_NAME:-}" in
            v*) VERSION_TAG="$GITHUB_REF_NAME" ;;
            *)  VERSION_TAG="v2.24.30" ;;
          esac
          case "$VERSION_TAG" in
            *-rc*|*beta*|*candidate*) IS_PRERELEASE="true"; MAKE_LATEST="false"; TITLE_SUFFIX=" (Pre-release)" ;;
            *)                       IS_PRERELEASE="false"; MAKE_LATEST="true"; TITLE_SUFFIX="" ;;
          esac
          echo "VERSION_TAG=$VERSION_TAG" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> "$GITHUB_ENV"
          echo "MAKE_LATEST=$MAKE_LATEST" >> "$GITHUB_ENV"
          echo "TITLE_SUFFIX=$TITLE_SUFFIX" >> "$GITHUB_ENV"

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: "AdGuard-Home-GoGoGo Manager ${{ env.VERSION_TAG }}${{ env.TITLE_SUFFIX }}"
          draft: false
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          make_latest: ${{ env.MAKE_LATEST }}
          body: |
            ### AdGuard-Home-GoGoGo Manager `${{ env.VERSION_TAG }}`

            **AdGuard-Home-GoGoGo Manager - 专为 [AdGuard-Home-GoGoGo](https://github.com/WEIHEWU/AdGuard-Home-GoGoGo) 打造的轻量现代化 Android 控制面板**（桌面名称：`AdGuard Home GoGoGo`，快捷磁贴：`AGH GoGoGo`，包名：`com.wu.adgogogo`）。

            > ✅ **验证状态**：`flutter analyze --no-pub --no-fatal-infos`（0 error / 0 warning）、全量 56 项单元与 Widget 测试及 `arm64-v8a` 混淆 Release APK（`2.24.30+200`，`8,873,778 B`，SHA-256: `63994361c46e857c4321fca3cb002529debedbb37c60f084cb16ad9654b07663`）核验通过，并已完成真机诊断包全 8 项 `ok` 验收。

            #### 本次维护版更新内容
            - **提速诊断包 `04_lock_diagnostics.txt` 采集**：将针对核心与看门狗 PID 的逐个 `readlink` 循环重构为单次 `ls -ln /proc/$p/fd | grep -E 'agh_|flock'`，消除百余个 socket/pipe FD 遍历造成的毫秒级拖慢，真机单步耗时从 `1,766 ms` 降至 **`237 ms`**。
            - **沿用并巩固 `v2.24.29` 诊断增强**：保持公共 `Download/agh_diag_YYYYMMDD_HHMMSS_xxxx.zip`（设备本地时间命名）默认保存通道与 `manifest.json` 双时间戳、日志列表零布局改动、聚合详情一键放行/拦截及全部稳定性修复。

            #### 升级提示
            - 覆盖安装 Manager APK（`2.24.30+200`）或直接刷入模块 `v20261125.2` 即可自动完成更新。
          files: |
            releases/AdGuardHomeManager.apk
